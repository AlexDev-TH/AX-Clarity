name: build

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ghidra: "12.1.2"
            zip: "ghidra_12.1.2_PUBLIC_20260605.zip"
          - ghidra: "12.1.3"
            zip: "ghidra_12.1.3_PUBLIC_20260817.zip"
          - ghidra: "12.1.4"
            zip: "ghidra_12.1.4_PUBLIC_20260921.zip"
          - ghidra: "12.2"
            zip: "ghidra_12.2_PUBLIC_20261016.zip"
    env:
      GHIDRA_INSTALL_DIR: ${{ github.workspace }}/ghidra/ghidra_${{ matrix.ghidra }}_PUBLIC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Ghidra ${{ matrix.ghidra }}
        run: |
          curl -fsSL -o ghidra.zip "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${{ matrix.ghidra }}_build/${{ matrix.zip }}"
          mkdir ghidra && unzip -q ghidra.zip -d ghidra

      - name: Build extension
        run: python tools/build.py "$GHIDRA_INSTALL_DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: AX-Clarity-ghidra-${{ matrix.ghidra }}
          path: dist/*.zip

      - name: Attach zip to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
